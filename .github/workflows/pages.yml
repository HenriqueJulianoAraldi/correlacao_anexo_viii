name: Publicar no GitHub Pages

# Publica a pasta web/ no Pages.
# O passo configure-pages tenta habilitar o Pages sozinho (enablement: true).
# Se a conta não permitir — o Pages em repositório privado exige plano pago —
# ele falha avisando, e aí resta tornar o repositório público ou publicar em
# outro host estático. Veja a seção "Publicar" do README.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: publicacao
        uses: actions/deploy-pages@v4
